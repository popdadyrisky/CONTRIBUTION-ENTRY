<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CONTRIBUTION ENTRY</title>
        <link rel="stylesheet" href="authstyle.css">
    </head>
    <body>
            <div class="container">
                <div class="form-box login">
                    <form action="">
                        <h1>Login</h1>
                        <div class="input-box">
                            <input type="text" placeholder="Username" required>
                            <img class="icon-up" src="../pic/user.png" alt="">
                        </div>
                        <div class="input-box">
                            <input type="password" placeholder="Password" required>
                            <img class="icon-up" src="../pic/padlock.png" alt="">
                        </div>
                        <div class="forgot-link">
                            <a href="#">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn">Login</button>
                        <p>or login with social platforms</p>
                        <div class="social-icons">
                            <a href="#" aria-label="Login with Facebook"><img class="icon-down" src="../pic/facebook-app-symbol.png" alt="Facebook"></a>
                            <a href="#" aria-label="Login with Google"><img class="icon-down" src="../pic/google.png" alt="Google"></a>
                            <a href="#" aria-label="Login with Instagram"><img class="icon-down" src="../pic/instagram.png" alt="Instagram"></a>
                            <a href="#" aria-label="Login with Twitter"><img class="icon-down" src="../pic/twitter.png" alt="Twitter"></a>
                        </div>
                    </form>
                </div>

                <div class="form-box register">
                    <form action="">
                        <h1>Registration</h1>
                        <div class="input-box">
                            <input type="text" placeholder="Username" required>
                            <img class="icon-up" src="../pic/user.png" alt="">
                        </div>
                        <div class="input-box">
                            <input type="email" placeholder="Email" required>
                            <img class="icon-up" src="../pic/email.png" alt="">
                        </div>
                        <div class="input-box">
                            <input type="password" placeholder="Password" required>
                            <img class="icon-up" src="../pic/padlock.png" alt="">
                        </div>
                        <button type="submit" class="btn">Register</button>
                        <p>or Register with social platforms</p>
                        <div class="social-icons">
                            <a href="#" aria-label="Register with Facebook"><img class="icon-down" src="../pic/facebook-app-symbol.png" alt="Facebook"></a>
                            <a href="#" aria-label="Register with Google"><img class="icon-down" src="../pic/google.png" alt="Google"></a>
                            <a href="#" aria-label="Register with Instagram"><img class="icon-down" src="../pic/instagram.png" alt="Instagram"></a>
                            <a href="#" aria-label="Register with Twitter"><img class="icon-down" src="../pic/twitter.png" alt="Twitter"></a>
                        </div>
                    </form>
                </div>

                <div class="toggle-box">
                    <div class="toggle-panel toggle-left">
                        <h1>Hello, welcome!</h1>
                        <p>Don't have an account?</p>
                        <button class="btn register-btn">Register</button>
                    </div>

                    <div class="toggle-panel toggle-right">
                        <h1>Welcome Back!</h1>
                        <p>Already have an account?</p>
                        <button class="btn login-btn">Login</button>
                    </div>
                </div>
            </div>
        <script src="app.js"></script>
    </body>
</html>
